services:
  mysql:
    image: mysql:8.0
    container_name: mealiver-mysql
    restart: unless-stopped
    # 2026-08-21: HikariCP/Tomcat threads.max를 300->600으로 같이 올림(Tomcat MBean 지표
    # 실측 - 부하테스트 시작 직후 스레드풀이 300까지 포화됨 확인). Adminer 등 다른 클라이언트
    # 접속 여유를 남기기 위해 600이 아니라 700으로 설정 (Mealiver-IT-BE
    # api/application.properties spring.datasource.hikari.maximum-pool-size와 짝을 맞춰야 함).
    command: --max-connections=700
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mealiver}
      MYSQL_USER: ${MYSQL_USER:-mealiver}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mealiver1234}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root1234}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mealiver-net]

  # 2026-08-21: MySQL 내부 지표(Threads_running/connected, InnoDB 행 락 대기 등)를
  # Prometheus가 수집하게 하는 사이드카 - redis-exporter와 동일한 목적. DATA_SOURCE_NAME은
  # root가 아니라 전용 모니터링 계정을 쓴다(PROCESS/REPLICATION CLIENT/SELECT만 가능,
  # 최소 권한). docker-entrypoint-initdb.d는 볼륨이 이미 존재하면 다시 안 돌아가므로,
  # 이 계정은 기존 mysql_data 볼륨에 한 번 수동으로 만들어줘야 한다 - README/PR 설명 참고.
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mealiver-mysql-exporter
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "${MYSQL_EXPORTER_USER:-exporter}:${MYSQL_EXPORTER_PASSWORD:-exporter1234}@(mysql:3306)/"
    ports:
      - "9104:9104"
    networks: [mealiver-net]

  redis:
    image: redis:7
    container_name: mealiver-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mealiver-net]

  # 2026-08-21: Redis 서버 자체 지표(메모리/커넥션/초당 명령 처리량 등)를 Prometheus가
  # 수집하게 하는 사이드카. 앱 쪽(Lettuce 클라이언트) 지표는 이미 잡히고 있었지만
  # Redis 서버 지표는 전혀 없었음 - 부하테스트 중 Tomcat/HikariCP와 같은 화면에서
  # Redis 상태도 실시간으로 보기 위해 추가.
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: mealiver-redis-exporter
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks: [mealiver-net]

  # Zookeeper 없이 Kafka 자체가 메타데이터 합의를 처리하는 KRaft 모드 (단일 노드: broker+controller 겸용).
  # CLUSTER_ID는 이 클러스터를 위해 한 번 생성한 고정값 — 바꾸면 기존 데이터를 못 읽으니 재발급하지 말 것.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: mealiver-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MgNjdn8tQWaW2zIZNRtfWQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [mealiver-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mealiver-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8082:8080"
    networks: [mealiver-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: mealiver-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [mealiver-net]

  grafana:
    image: grafana/grafana:latest
    container_name: mealiver-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [mealiver-net]

  adminer:
    image: adminer:latest
    container_name: mealiver-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    networks: [mealiver-net]

  # API 이미지는 Mealiver-IT-BE 레포의 CI에서 빌드되어 레지스트리(GHCR 등)에 push된 것을 그대로 pull해서 쓴다.
  # 이미지가 아직 없다면 `docker compose up -d mysql redis kafka kafka-ui prometheus grafana adminer` 로
  # 인프라만 먼저 띄우고, API는 로컬(IDE/mvnw)에서 직접 실행해도 된다.
  api:
    image: ${API_IMAGE:-ghcr.io/mealiver-it/mealiver-it-be:latest}
    container_name: mealiver-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mealiver}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-mealiver}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-mealiver1234}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    networks: [mealiver-net]

  # FE 이미지는 Mealiver-IT-FE 레포의 CI에서 빌드되어 GHCR에 push된 nginx 이미지를 그대로 pull해서 쓴다.
  # nginx가 /api/* 요청을 같은 네트워크의 api 컨테이너로 proxy_pass 하므로 FE 자체는 백엔드 주소를 몰라도 된다.
  fe:
    image: ${FE_IMAGE:-ghcr.io/mealiver-it/mealiver-it-fe:latest}
    container_name: mealiver-fe
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8083:80"
    networks: [mealiver-net]

volumes:
  mysql_data:
  grafana_data:

networks:
  mealiver-net:
    driver: bridge
