services:
  mysql:
    image: mysql:8.0
    container_name: mealiver-mysql
    restart: unless-stopped
    # 2026-08-21: HikariCP/Tomcat threads.max를 300->600으로 같이 올림(Tomcat MBean 지표
    # 실측 - 부하테스트 시작 직후 스레드풀이 300까지 포화됨 확인). Adminer 등 다른 클라이언트
    # 접속 여유를 남기기 위해 600이 아니라 700으로 설정 (Mealiver-IT-BE
    # api/application.properties spring.datasource.hikari.maximum-pool-size와 짝을 맞춰야 함).
    command: --max-connections=700
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mealiver}
      MYSQL_USER: ${MYSQL_USER:-mealiver}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mealiver1234}
      # 2026-08-26: 컨테이너 기본 타임존이 UTC라(TZ 미설정), NOW()/CURRENT_TIMESTAMP 등이
      # 한국 시간보다 9시간 느리게 나왔다(api 서비스도 같은 이유로 TZ 추가 - 아래 참고).
      # 기존에 이미 UTC로 쌓인 데이터는 그대로 두고(별도 마이그레이션 필요), 이 값 이후
      # 새로 쓰이는 시각부터 정상화한다.
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root1234}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mealiver-net]

  # 2026-08-21: MySQL 내부 지표(Threads_running/connected, InnoDB 행 락 대기 등)를
  # Prometheus가 수집하게 하는 사이드카 - redis-exporter와 동일한 목적. root가 아니라
  # 전용 모니터링 계정을 쓴다(PROCESS/REPLICATION CLIENT/SELECT만 가능, 최소 권한).
  # docker-entrypoint-initdb.d는 볼륨이 이미 존재하면 다시 안 돌아가므로, 이 계정은
  # 기존 mysql_data 볼륨에 한 번 수동으로 만들어줘야 한다 - README/PR 설명 참고.
  #
  # DATA_SOURCE_NAME 환경변수 방식은 mysqld_exporter 최신 버전(0.20.0)에서 제거됨 -
  # .my.cnf 파일을 마운트하고 --config.my-cnf로 지정하는 방식으로 대체(실측: env var만
  # 쓰면 "no user specified in section or parent" 에러로 계속 재시작 실패함, up=0).
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: mealiver-mysql-exporter
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./mysql-exporter/.my.cnf:/.my.cnf:ro
    command:
      - --config.my-cnf=/.my.cnf
    ports:
      - "9104:9104"
    networks: [mealiver-net]

  redis:
    image: redis:7
    container_name: mealiver-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [mealiver-net]

  # 2026-08-21: Redis 서버 자체 지표(메모리/커넥션/초당 명령 처리량 등)를 Prometheus가
  # 수집하게 하는 사이드카. 앱 쪽(Lettuce 클라이언트) 지표는 이미 잡히고 있었지만
  # Redis 서버 지표는 전혀 없었음 - 부하테스트 중 Tomcat/HikariCP와 같은 화면에서
  # Redis 상태도 실시간으로 보기 위해 추가.
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: mealiver-redis-exporter
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks: [mealiver-net]

  prometheus:
    image: prom/prometheus:latest
    container_name: mealiver-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [mealiver-net]

  grafana:
    image: grafana/grafana:latest
    container_name: mealiver-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks: [mealiver-net]

  adminer:
    image: adminer:latest
    container_name: mealiver-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8081:8080"
    networks: [mealiver-net]

  # API 이미지는 Mealiver-IT-BE 레포의 CI에서 빌드되어 레지스트리(GHCR 등)에 push된 것을 그대로 pull해서 쓴다.
  # 이미지가 아직 없다면 `docker compose up -d mysql redis prometheus grafana adminer` 로
  # 인프라만 먼저 띄우고, API는 로컬(IDE/mvnw)에서 직접 실행해도 된다.
  api:
    image: ${API_IMAGE:-ghcr.io/mealiver-it/mealiver-it-be:latest}
    container_name: mealiver-api
    restart: unless-stopped
    # 2026-08-22: application.properties의 server.tomcat.accept-count=5000이 실제로는
    # min(net.core.somaxconn, accept-count)로 캡핑되고 있었음 - 컨테이너 기본 somaxconn(4096)
    # 확인(docker exec mealiver-api cat /proc/sys/net/core/somaxconn)으로 실측. accept-count와
    # 같은 값으로 맞춰서 의도한 백로그 크기가 그대로 적용되게 한다.
    sysctls:
      - net.core.somaxconn=5000
    # 2026-08-24: kafka를 실제로 안 쓰고 있어서 서버에서 서비스 자체를 내렸다 - depends_on/
    # SPRING_KAFKA_BOOTSTRAP_SERVERS도 같이 제거(더 안 쓰는 kafka 호스트를 가리키게 두면
    # 혼란만 생김).
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mealiver}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-mealiver}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-mealiver1234}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # 2026-08-24: 정합성 검증 리포트(SlackNotifier)가 요구하는 필수 플레이스홀더 -
      # 값이 없으면 PlaceholderResolutionException으로 앱이 아예 기동 실패한다(실측).
      # 기본값을 빈 문자열로 둬서 .env에 값이 없어도 최소한 기동은 되게 한다.
      SLACK_CONSISTENCY_WEBHOOK_URL: ${SLACK_CONSISTENCY_WEBHOOK_URL:-}
      # 2026-08-26: 위와 같은 이유로 NotionReportGenerator(정합성 검증 리포트를 Notion 페이지로
      # 발행)도 필수 플레이스홀더라, notion.api.token/notion.database-id 값이 없으면
      # PlaceholderResolutionException으로 앱이 통째로 기동 실패한다(실측 - api 컨테이너가
      # 아예 안 뜸). fix/verification PR(#162, Mealiver-IT-BE)이 이 값을 추가했는데 여기
      # 반영이 안 돼서 실제로 장애가 났다. 빈 문자열로 최소 기동은 되게 하고, 실제 Notion
      # 연동이 필요하면 .env에 NOTION_API_TOKEN/NOTION_DATABASE_ID를 채워 넣으면 된다
      # (값이 비어있으면 검증 배치의 Notion 리포트 생성 단계만 실패하고 나머지 API는 정상 동작).
      NOTION_API_TOKEN: ${NOTION_API_TOKEN:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
      # 2026-08-26: 관리자 대시보드의 "지금 검증 실행" 버튼이 이 플래그로 켜지는 Job Bean에
      # 의존한다(ConsistencyVerificationJobConfig) - 꺼져있으면 컨트롤러는 뜨되 503으로 막힌다.
      # 로컬에서는 되던 게 공유 서버에서는 이 값이 없어 막혔었다(요청으로 추가).
      APP_CONSISTENCY_VERIFICATION_ENABLED: ${APP_CONSISTENCY_VERIFICATION_ENABLED:-true}
      # 2026-08-26: JVM 기본 타임존이 UTC라(베이스 이미지에 TZ 미설정) LocalDateTime.now()가
      # 한국 시간보다 9시간 느린 값을 반환 - DATETIME 컬럼(타임존 정보 없이 값 그대로 저장)에
      # 그 값이 그대로 박혀서 이상하게 보이던 문제. 신규 데이터부터 정상화하고, 기존에 이미
      # UTC로 쌓인 데이터 보정은 별도로 처리한다.
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    networks: [mealiver-net]

  # FE 이미지는 Mealiver-IT-FE 레포의 CI에서 빌드되어 GHCR에 push된 nginx 이미지를 그대로 pull해서 쓴다.
  # nginx가 /api/* 요청을 같은 네트워크의 api 컨테이너로 proxy_pass 하므로 FE 자체는 백엔드 주소를 몰라도 된다.
  fe:
    image: ${FE_IMAGE:-ghcr.io/mealiver-it/mealiver-it-fe:latest}
    container_name: mealiver-fe
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8083:80"
    networks: [mealiver-net]

volumes:
  mysql_data:
  grafana_data:

networks:
  mealiver-net:
    driver: bridge
